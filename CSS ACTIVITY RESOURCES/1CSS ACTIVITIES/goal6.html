<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal6</title>
</head>
<style>
    body{
        margin:0;
        padding: 20px;
        background-color: white;
    }

    .outer-box {
        background-color: purple;
        padding: 10px;
        margin: 20px;
    }

    .inner-box{
        background-color: blue;
        padding: 10px;
    }

    .yellow-text{
        color: yellow;
        font-size: 32px;
        font-weight: bold;
        margin: 10px 0;
    }

    .red-box{
        background-color: #f04416;
        color: white;
        font-size: 32px;
        padding: 10px;
        margin-bottom: 50px;
    }
    .red-box:last-child{
        margin-bottom: 0;
    }
</style>
<body>
    <div class="outer-box">

      <div class="inner-box">

        <div class="yellow-text">
            Yellow Text
        </div>
        
        <div class="red-box">
            White Text
        </div>

        <div class="yellow-text">
            Yellow Text
        </div>

        <div class="red-box">
          White Text
        </div>
    </div>
</div>
</body>
</html>
