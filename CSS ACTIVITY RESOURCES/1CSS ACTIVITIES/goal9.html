<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal9</title>
</head>
<style>
    h1{
        font-size: 40px;
    }
    .container{
        display:flex;
        gap: 10px;
    }
    .box{
       display:inline-block;
       width: 30%;
       height: 380px;
       color: white;
       font-size: 25px;
       vertical-align: top;
    }

    .red {
        background-color: red;
        width:  300px;
        height: 300px;
        font-size: 20px;
    }

    .green {
        background-color: green;
        width:  300px;
        height: 300px;
        font-size: 20px;
        margin-: 250px;

    }

    .blue {
        background-color: blue;
        width:  300px;
        height: 300px;
        font-size: 20px;
        margin-: 250px;
    }

</style>
<body>
    <h1>CSS Display Property</h1>

    <div class="box red">
         Red Paragraph
    </div>
    <div class="box green">
         Green Paragraph
    </div>
    <div class="box blue">
         Blue Paragraph
    </div>

</body>
</html>
