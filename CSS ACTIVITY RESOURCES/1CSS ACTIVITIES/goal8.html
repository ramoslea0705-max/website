<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0;
        justify-items: center;
    }

    .blue-box{
        width: 500px;
        height: 300px;
        background-color: blue;
        margin-left: 50px;
        margin-top: 200px;
        position: relative;
    }
    .red-circle{
        width: 250px;
        height: 250px;
        background-color: red;
        border-radius: 100%;
        position: absolute;
        left: 200px;
        top: 150px;
    }
    
</style>
<body>

    <div class="blue-box">
        <div class="red-circle"></div>
    </div>

</body>
</html>
