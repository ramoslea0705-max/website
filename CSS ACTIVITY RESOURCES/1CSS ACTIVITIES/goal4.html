<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: #1685d4;
        color: white;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
    h1{
        font-size: 50px;
    }
    .color{
        color: red;
        font-size: 25px;
    }
    .font-size{
        font-size: 60px;
    }
    .font-weight{
        font-weight: bold;
        font-size: 30px;
    }
    .font-family{
        font-family: cursive;
        font-style: italic;
        font-size: 25px;
    }
    .text-align{
        text-align: right;
        font-size: 25px;
    }
</style>
<body>
    <h1>Important CSS Properties</h1>

    <p class="color">Color</p>

    <p class="font-size">Font Size</p>

    <p class="font-weight">Font Weight</p>

    <p class="font=family">Font Family</p>

    <p class="text-align">Text Align</p>

</body>
</html>
