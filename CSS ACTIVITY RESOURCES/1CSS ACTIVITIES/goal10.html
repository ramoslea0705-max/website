<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goal10</title>
</head>
<style>
    body{
        background-color: white;
    }

    .red-box{
        background-color: red;
        width:  300px;
        height: 300px;
        font-size: 20px;
    }
    .green-box{
        background-color: green;
        width: 300px;
        height: 300px;
        font-size: 20px;
    }
    .blue-box{
        background-color: blue;
        width: 300px;
        height: 300px;
        font-size: 20px;
    }

</style>
<body>
    <h1>CSS Display Property</h1>

    <div class="red-box">
        <p style="color: white;"> Red Paragraph</p>
    </div>
    <div class="green-box">
        <p style="color: white;"> Green Paragraph</p>
    </div>
    <div class="blue-box">
        <p style="color: white;"> Blue Paragraph</p>
    </div>
</body>
</html>
